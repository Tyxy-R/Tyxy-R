name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#262626&color_dots=#f5f1ea,#e7ddd2,#d2b8a3,#bb8062,#9b4d36
            dist/github-contribution-grid-snake-dark.svg?color_snake=#f2eee8&color_dots=#161b22,#39332f,#67493c,#a16247,#d18967

      - name: Publish generated SVGs
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}